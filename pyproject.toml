[project]
name = "auto-fact-checker"
version = "0.1.0"
description = "Configurable rigorous LLM fact-checker: Gradio UI over OpenAI/Anthropic APIs and Claude Code/Codex agents, with a SciFact benchmark harness"
readme = "README.md"
authors = [
    { name = "BurnyCoder", email = "happymancz@email.cz" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.1.0",
    "gradio>=6.30.0",
    "jinja2>=3.1.6",
    "json-repair>=0.64.1",
    "openai>=3.37.0",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
# `uv run afc ...` is the single command-line entry point (ui | check | spend | bench | correct-eval | ai-errors), see src/auto_fact_checker/__main__.py
afc = "auto_fact_checker.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "matplotlib>=3.11.2", # the offline suite checks the actual median bars in the scientific plot
]
docs = [
    "playwright>=1.64.0",
]
paper = [
    "matplotlib>=3.11.2",
    "typst>=0.15.0",
]

[tool.pytest.ini_options]
# Live tests call real (paid) LLM APIs/CLIs, so they only run when explicitly requested with `-m live`.
# https://docs.pytest.org/en/stable/example/markers.html
markers = ["live: calls real LLM APIs / CLIs (costs money, needs .env keys)"]
addopts = "-m 'not live'"
testpaths = ["tests"]
